name = "clauxen-chat-history"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
account_id = "8fc7a67e9057989309921f362784ecf4"
workers_dev = true
preview_urls = true

# Place near Supabase (us-west-1) for multi-query Hyperdrive latency.
[placement]
region = "aws:us-west-1"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Cache API / KV TTLs — Hyperdrive is miss-only.
LATEST_PAGE_CACHE_TTL_SECONDS = "1800"
CURSOR_PAGE_CACHE_TTL_SECONDS = "300"
CHAT_LIST_CACHE_TTL_SECONDS = "120"
JWT_CACHE_TTL_SECONDS = "60"
APP_ORIGIN = "https://clauxen.com,https://www.clauxen.com,http://localhost:9002"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "54df64d31cce4e6f8f34415c6fb4e849"
localConnectionString = "postgres://postgres:postgres@127.0.0.1:5432/postgres"

# Optional: create a second Hyperdrive with --caching-disabled for fresh reads,
# then set binding id here after `wrangler hyperdrive create ... --caching-disabled`.
# [[hyperdrive]]
# binding = "HYPERDRIVE_FRESH"
# id = "REPLACE_WITH_FRESH_HYPERDRIVE_ID"

[[kv_namespaces]]
binding = "CHAT_HISTORY_CACHE"
id = "8d917e9639df4dc2a12be2a35cf264af"

[[r2_buckets]]
binding = "CHAT_ARCHIVES"
bucket_name = "clauxen-chat-archives"
