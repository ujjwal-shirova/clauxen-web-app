name = "clauxen-chat-history"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
account_id = "8fc7a67e9057989309921f362784ecf4"
workers_dev = true
preview_urls = true

# Place near Supabase (us-west-1) for multi-query Hyperdrive latency.
[placement]
region = "aws:us-west-1"

[observability]
enabled = true
# Chat history is the highest-volume Worker. Sample traces to retain a
# representative latency/error signal without paying to persist every request.
head_sampling_rate = 0.05

[vars]
# Cache API / KV hints are opt-in for mutable conversations. Short TTLs limit
# stale exposure if a future caller explicitly chooses the `fresh=0` path.
LATEST_PAGE_CACHE_TTL_SECONDS = "60"
CURSOR_PAGE_CACHE_TTL_SECONDS = "300"
CHAT_LIST_CACHE_TTL_SECONDS = "60"
JWT_CACHE_TTL_SECONDS = "300"
APP_ORIGIN = "https://clauxen.com,https://www.clauxen.com,https://*.vercel.app,http://localhost:9002"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "54df64d31cce4e6f8f34415c6fb4e849"
localConnectionString = "postgres://postgres:postgres@127.0.0.1:5432/postgres"

# HYPERDRIVE is cache-disabled in Cloudflare so a cache miss is always
# read-after-write consistent. Keep this optional binding for future dedicated
# fresh routing if a separate cached Hyperdrive is introduced for analytics.
# [[hyperdrive]]
# binding = "HYPERDRIVE_FRESH"
# id = "DEDICATED_FRESH_HYPERDRIVE_ID"

[[kv_namespaces]]
binding = "CHAT_HISTORY_CACHE"
id = "8d917e9639df4dc2a12be2a35cf264af"

[[r2_buckets]]
binding = "CHAT_ARCHIVES"
bucket_name = "clauxen-chat-archives"

# Non-blocking warm + R2 archive fanout (P4).
[[queues.producers]]
binding = "HISTORY_JOBS"
queue = "clauxen-chat-history-jobs"

[[queues.consumers]]
queue = "clauxen-chat-history-jobs"
max_batch_size = 8
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "clauxen-chat-history-jobs-dlq"
