name = "clauxen-chat-history"
main = "src/index.ts"
compatibility_date = "2025-02-04"
compatibility_flags = ["nodejs_compat"]

# Place near Supabase (us-west-1) for low query latency.
[placement]
region = "wnam"

[vars]
LATEST_PAGE_CACHE_TTL_SECONDS = "10"

# After:
#   npx wrangler hyperdrive create clauxen-supabase-chat --connection-string="$POSTGRES_URL_NON_POOLING"
# uncomment and paste the id:
#
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-id>"
# localConnectionString = "postgres://postgres:postgres@127.0.0.1:5432/postgres"
#
# Until Hyperdrive is configured, set secret DATABASE_URL (Supabase non-pooling).
