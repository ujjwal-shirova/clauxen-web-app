name = "clauxen-scheduled-tasks"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
account_id = "8fc7a67e9057989309921f362784ecf4"

[observability]
enabled = true
head_sampling_rate = 1

# Secrets (wrangler secret put):
#   SCHEDULED_TASKS_INTERNAL_TOKEN
#   APP_ORIGIN  (e.g. https://clauxen.com)

[vars]
# Overridden per-env if needed; secret preferred for APP_ORIGIN in prod.

# Fire every minute — Worker POSTs to Vercel dispatch endpoint.
[triggers]
crons = ["* * * * *"]
