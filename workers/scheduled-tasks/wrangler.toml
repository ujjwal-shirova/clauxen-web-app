name = "clauxen-scheduled-tasks"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
account_id = "8fc7a67e9057989309921f362784ecf4"

[observability]
enabled = true
head_sampling_rate = 1

# Secrets (wrangler secret put):
#   SCHEDULED_TASKS_INTERNAL_TOKEN
#   APP_ORIGIN  (e.g. https://www.clauxen.com)

[vars]
# Overridden per-env if needed; secret preferred for APP_ORIGIN in prod.

# Fire every minute — claim durable runs, enqueue them, then execute one/run.
[triggers]
crons = ["* * * * *"]

[[queues.producers]]
binding = "AUTOMATION_QUEUE"
queue = "clauxen-automation-runs"

[[queues.consumers]]
queue = "clauxen-automation-runs"
dead_letter_queue = "clauxen-automation-runs-dlq"
max_batch_size = 3
max_batch_timeout = 2
max_retries = 5
retry_delay = 60
