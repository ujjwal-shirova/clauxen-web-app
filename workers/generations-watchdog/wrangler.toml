name = "clauxen-generations-watchdog"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
account_id = "8fc7a67e9057989309921f362784ecf4"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
APP_ORIGIN = "https://www.clauxen.com"
CONTINUATION_ORIGIN = "https://clauxen-shirova-ai.vercel.app"

# Secrets (wrangler secret put):
#   GENERATIONS_INTERNAL_TOKEN
#   VERCEL_AUTOMATION_BYPASS_SECRET

# Poke Vercel's generations watchdog every minute.
[triggers]
crons = ["* * * * *"]
