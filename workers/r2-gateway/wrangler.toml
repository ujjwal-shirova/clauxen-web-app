name = "clauxen-r2-gateway"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
account_id = "8fc7a67e9057989309921f362784ecf4"

[observability]
enabled = true
# Retain enough upload/download diagnostics without full-volume trace spend.
head_sampling_rate = 0.1

[vars]
# SUPABASE_URL and SUPABASE_ANON_KEY set via wrangler secret

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "clauxen-images"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "clauxen-documents"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "clauxen-artifacts"

[[r2_buckets]]
binding = "USER_FILES"
bucket_name = "clauxen-documents"
