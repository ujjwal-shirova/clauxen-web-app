name: Deploy Cloudflare App

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-app-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "8fc7a67e9057989309921f362784ecf4"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
      NEXT_PUBLIC_APP_URL: "https://www.clauxen.com"
      HOSTING_PLATFORM: cloudflare
      AUTH_DEV_BYPASS: "false"
      STORAGE_REQUIRE_R2: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
      - run: npm ci
      - run: npm run test:cloudflare:build && npm run test:cloudflare && npm run test:background && npm run test:scheduled
      - run: npm run cf:build
      - run: npm run cf:deploy
      - run: node scripts/verify-cloudflare-http.mjs
