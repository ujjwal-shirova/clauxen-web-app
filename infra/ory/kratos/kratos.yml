version: v1.3.1

dsn: postgres://ory:ory@ory-postgres:5432/ory?sslmode=disable

serve:
  public:
    base_url: http://127.0.0.1:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:9002
        - http://127.0.0.1:9002
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://127.0.0.1:4434/

selfservice:
  default_browser_return_url: http://localhost:9002/
  allowed_return_urls:
    - http://localhost:9002
  methods:
    password:
      enabled: true
  flows:
    registration:
      ui_url: http://localhost:9002/
    login:
      ui_url: http://localhost:9002/
    logout:
      after:
        default_browser_return_url: http://localhost:9002/

log:
  level: info

secrets:
  cookie:
    - change-me-kratos-cookie-secret-32chars-min

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
